{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Gagah Home Made-Biko</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .reset-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.6rem;
      color: white;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: #888;
      text-decoration: none;
      margin-top: 20px;
    }
    .back-link:hover { color: var(--accent-gold); }
  </style>
</head>
<body>
  <form style="display:none">{% csrf_token %}</form>
  <div class="auth-page">
    <div class="auth-card">
      <div class="reset-icon"><i class="fa-solid fa-lock-open"></i></div>
      <div class="logo" style="margin-bottom: 8px;"><a href="/">Gagah</a></div>
      <h2 style="margin-bottom: 8px;">Forgot Your Password?</h2>
      <p style="margin-bottom: 28px; color: #888; font-size: 0.95rem;">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <input type="email" id="resetEmail" placeholder="Your Email Address" style="width:100%; box-sizing:border-box; margin-bottom: 16px;" required>
      <button type="button" id="sendResetBtn" class="btn btn-primary full-width">
        Send Reset Link
      </button>

      <a href="{% url 'login' %}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Remember your password? Log In
      </a>
    </div>
  </div>

  <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(
                        cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById('sendResetBtn')
      .addEventListener('click', async function () {
        const email = document.getElementById('resetEmail').value.trim();
        const btn   = document.getElementById('sendResetBtn');

        if (!email) {
            alert('Please enter your email address.');
            return;
        }

        btn.textContent = 'Sending...';
        btn.disabled    = true;

        try {
            const response = await fetch('/send-reset-email/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ email })
            });

            const result = await response.json();

            if (result.success) {
                window.location.href = '/forgot-password/done/';
            } else {
                alert('Error: ' + result.error);
                btn.textContent = 'Send Reset Link';
                btn.disabled    = false;
            }

        } catch (err) {
            console.error(err);
            alert('Network error. Please try again.');
            btn.textContent = 'Send Reset Link';
            btn.disabled    = false;
        }
    });
  </script>
</body>
</html>
