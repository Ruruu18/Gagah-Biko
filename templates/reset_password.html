{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Gagah Home Made-Biko</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260517-password-eye-v1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .reset-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.6rem;
      color: white;
    }
    .strength-hint {
      font-size: 0.78rem;
      color: #aaa;
      margin-top: -10px;
      margin-bottom: 16px;
      padding-left: 4px;
    }
  </style>
</head>
<body>
  <form style="display:none">{% csrf_token %}</form>

  <!-- Pass uidb64 and token from Django view into JS -->
  <input type="hidden" id="uidb64"     value="{{ uidb64 }}">
  <input type="hidden" id="resetToken" value="{{ token }}">

  <div class="auth-page">
    <div class="auth-card">
      <div class="reset-icon"><i class="fa-solid fa-key"></i></div>
      <div class="logo" style="margin-bottom: 8px;"><a href="/">Gagah</a></div>
      <h2 style="margin-bottom: 8px;">Set New Password</h2>
      <p style="margin-bottom: 24px; color: #888; font-size: 0.95rem;">
        Enter your new password below. Choose something strong!
      </p>

      <div class="password-field">
        <input type="password" id="newPassword" placeholder="New Password" style="width:100%; box-sizing:border-box;" required>
        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" title="Show password">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
      </div>
      <p class="strength-hint"><i class="fa-solid fa-circle-info"></i> Minimum 8 characters</p>

      <div class="password-field">
        <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" style="width:100%; box-sizing:border-box; margin-bottom: 20px;" required>
        <button type="button" class="password-toggle" data-target="confirmNewPassword" aria-label="Show password" title="Show password">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
      </div>

      <button type="button" id="resetPasswordBtn" class="btn btn-primary full-width">
        Reset Password
      </button>

      <div style="margin-top: 16px; text-align: center; font-size: 0.88rem;">
        <a href="{% url 'forgot_password' %}" style="color: #aaa;">Request a new link</a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/script.js' %}?v=20260517-password-eye-v1"></script>
  <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(
                        cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById('resetPasswordBtn')
      .addEventListener('click', async function () {
        const password = document.getElementById('newPassword').value;
        const confirm  = document.getElementById('confirmNewPassword').value;
        const uidb64   = document.getElementById('uidb64').value;
        const token    = document.getElementById('resetToken').value;
        const btn      = document.getElementById('resetPasswordBtn');

        if (!password || !confirm) {
            alert('Please fill in both password fields.');
            return;
        }
        if (password !== confirm) {
            alert('Passwords do not match.');
            return;
        }
        if (password.length < 8) {
            alert('Password must be at least 8 characters.');
            return;
        }

        btn.textContent = 'Resetting...';
        btn.disabled    = true;

        try {
            const response = await fetch('/reset-password-confirm/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({
                    uidb64,
                    token,
                    password,
                    confirm_password: confirm
                })
            });

            const result = await response.json();

            if (result.success) {
                alert('Password reset successfully! Please log in with your new password.');
                window.location.href = '/login/';
            } else {
                alert('Error: ' + result.error);
                btn.textContent = 'Reset Password';
                btn.disabled    = false;
            }

        } catch (err) {
            console.error(err);
            alert('Network error. Please try again.');
            btn.textContent = 'Reset Password';
            btn.disabled    = false;
        }
    });
  </script>
</body>
</html>
