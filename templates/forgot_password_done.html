{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Sent - Gagah Home Made-Biko</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .success-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b1f1f, var(--accent-gold));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 2rem;
      color: white;
      box-shadow: 0 8px 24px rgba(59, 31, 31, 0.25);
    }
    .expire-note {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 12px;
    }
    .retry-note {
      margin-top: 20px;
      font-size: 0.88rem;
      color: #888;
    }
    .retry-note a {
      color: var(--accent-gold);
      font-weight: 600;
      text-decoration: none;
    }
    .retry-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="text-align: center;">
      <div class="logo" style="margin-bottom: 16px;"><a href="/">Gagah</a></div>
      <div class="success-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>

      <h2 style="margin-bottom: 12px;">Check Your Email!</h2>
      <p style="color: #666; line-height: 1.7; margin-bottom: 6px;">
        We've sent a password reset link to your email address. 
        Please check your inbox — and your <strong>spam folder</strong> just in case.
      </p>
      <p class="expire-note"><i class="fa-regular fa-clock"></i> The link will expire in 24 hours.</p>

      <a href="{% url 'login' %}" class="btn btn-primary full-width" style="margin-top: 28px;">
        Back to Login
      </a>

      <p class="retry-note">
        Didn't receive the email?
        <a href="{% url 'forgot_password' %}">Try again</a>
      </p>
    </div>
  </div>
</body>
</html>
